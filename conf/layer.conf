BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "netbird"
BBFILE_PATTERN_netbird = "^${LAYERDIR}/"
BBFILE_PRIORITY_netbird = "6"

LAYERVERSION_netbird = "1"
LAYERDEPENDS_netbird = "core"
LAYERSERIES_COMPAT_netbird = "dunfell kirkstone scarthgap styhead walnascar"

# NetBird needs /dev/net/tun. Add the CONFIG_TUN=y fragment to whichever kernel
# recipe the MACHINE selects (PREFERRED_PROVIDER_virtual/kernel), so the layer
# needs no per-board kernel bbappend. The key is expanded per recipe at parse
# time, after the machine config has set the provider.
# Only kernels that merge .cfg fragments (kernel-yocto and most BSP kernels)
# pick it up. Set NETBIRD_KERNEL_FRAGMENT = "" in local.conf to turn this off,
# e.g. when the kernel already has CONFIG_TUN.
NETBIRD_LAYERDIR := "${LAYERDIR}"
NETBIRD_KERNEL_FRAGMENT ?= "file://netbird.cfg"
FILESEXTRAPATHS:prepend:pn-${PREFERRED_PROVIDER_virtual/kernel} = "${NETBIRD_LAYERDIR}/recipes-kernel/linux/files:"
SRC_URI:append:pn-${PREFERRED_PROVIDER_virtual/kernel} = " ${NETBIRD_KERNEL_FRAGMENT}"
